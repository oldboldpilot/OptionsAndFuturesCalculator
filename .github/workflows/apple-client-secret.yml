# Rotate the Apple "Sign in with Apple" client secret before it expires.
#
# @author Olumuyiwa Oluwasanmi
#
# WHY DAILY, FOR A SECRET THAT LASTS SIX MONTHS
#
# Because the job asks about the OUTCOME ("how many days are left on the
# deployed secret?") rather than about the calendar ("is it March yet?"). A
# calendar schedule has exactly one chance to fire and misses if the runner is
# down, the repo is archived for a week, or the cron syntax was wrong in a way
# nobody noticed for five months. A daily check that no-ops 150 times in a row
# cannot miss, and its no-op costs a few seconds.
#
# This is the same reasoning the Census state-assumptions job uses in the
# backend: a missed weekly calendar slot is a week of staleness nothing
# reports, so it asks "has a run succeeded in the last eight days?" instead.
#
# The failure this prevents is total and silent: when Apple's client secret
# lapses, every Sign in with Apple attempt fails at once with invalid_client,
# with no warning beforehand and no degraded mode.
name: apple-client-secret

on:
  schedule:
    # 06:12 UTC daily. Not on the hour, so it is not queued behind everybody
    # else's midnight cron on GitHub's shared runners.
    - cron: "12 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rotate even if the current secret is not near expiry"
        type: boolean
        default: false

concurrency:
  # Two rotations racing would both mint valid secrets and the loser's would be
  # the one deployed -- harmless but confusing in the audit trail.
  group: apple-client-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyjwt cryptography

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Report the current state before changing anything
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # continue-on-error because a MISSING secret is a legitimate first run,
        # and `inspect` exits non-zero for it on purpose.
        continue-on-error: true
        run: python3 scripts/apple_client_secret.py inspect --service supabase-auth

      - name: Rotate if within 30 days of expiry
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_SERVICE_ID: ${{ secrets.APPLE_SERVICE_ID }}
          APPLE_PRIVATE_KEY_P8: ${{ secrets.APPLE_PRIVATE_KEY_P8 }}
        run: |
          python3 scripts/apple_client_secret.py rotate \
            --service supabase-auth \
            --renew-before 30 \
            ${{ inputs.force && '--force' || '' }}

      - name: Confirm what is now deployed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: python3 scripts/apple_client_secret.py inspect --service supabase-auth
