syntax = "proto3";

// Canonical service contract. This file is the single source of truth for
// both sides of the wire:
//   * C++  — generated at build time by backend/CMakeLists.txt
//   * TS   — generated by scripts/gen_proto.sh into frontend/src/grpc/
//
// There used to be a second, incompatible copy at proto/calculator.proto with
// a different package and a different service name. The backend built against
// one and the browser against the other, so no call could ever have succeeded.
// That file is deleted; do not reintroduce it.

package calculator;

service OptionsCalculator {
  rpc CalculateStrategy (StrategyRequest) returns (StrategyResponse);
  rpc GetMarketQuote (QuoteRequest) returns (QuoteResponse);
  rpc GetMarketChain (ChainRequest) returns (ChainResponse);
  // The risk-free rate is a property of the market, not of a symbol, so it has
  // its own call rather than a field on QuoteResponse: hanging it off a
  // per-symbol response would refetch a global datum on every symbol change
  // and attribute its provenance to whichever ticker happened to ask.
  rpc GetRiskFreeRate (RiskFreeRateRequest) returns (RiskFreeRateResponse);
}

message Leg {
  enum Action { BUY = 0; SELL = 1; }
  enum Type { CALL = 0; PUT = 1; FUTURE = 2; STOCK = 3; }

  Action action = 1;
  Type type = 2;
  double strike = 3;
  double expiration_days = 4;
  int32 quantity = 5;

  // Entry price actually paid or received. Without it the engine cannot
  // compute P&L — it was missing from the old client-facing proto, so every
  // leg was implicitly priced at zero cost.
  double premium = 6;
  // Per-leg IV from the chain. Zero means "not quoted"; the engine refuses
  // rather than substituting a default.
  double implied_volatility = 7;
  // 100 for listed equity options, 50 for ES, and so on.
  double contract_multiplier = 8;
}

message StrategyRequest {
  string underlying_symbol = 1;
  double current_price = 2;
  double implied_volatility = 3;
  double risk_free_rate = 4;
  repeated Leg legs = 5;

  // Matrix parameters. Zero means "use the engine default".
  double price_range_percent = 6;  // e.g. 0.20 for ±20%
  uint32 price_steps = 7;
  uint32 date_steps = 8;
  // Continuous dividend yield, as a decimal (0.013 for 1.3% p.a.).
  //
  // Consumed by the Black-Scholes-Merton path: the engine prices at a
  // discounted spot S*exp(-qT), which is exactly Merton's model, and adjusts
  // each Greek by its derived factor. Zero means no dividend is modelled and
  // the result is bit-for-bit the plain Black-Scholes answer.
  //
  // This is an ASSUMPTION, not measured data — no provider wired into this
  // engine publishes a forward-looking continuous yield. A client that lets a
  // user set it must label it as stated rather than measured, the same way the
  // risk-free rate distinguishes its two sources.
  double dividend_yield = 9;
}

// Position-level sensitivities, already multiplied by contract multiplier,
// quantity and direction — these are position numbers, not per-share numbers.
//
// Units are part of the datum. sensen computes textbook Black-Scholes
// derivatives, which are per year and per 1.00 of vol/rate; the service
// converts them here to the conventions a trader reads, once, so that every
// client gets the same answer instead of each guessing.
message Greeks {
  double delta = 1;   // share-equivalents of the underlying
  double gamma = 2;   // change in delta per $1 move in the underlying
  double theta = 3;   // dollars per calendar day
  double vega = 4;    // dollars per 1 implied-vol point (1%)
  double rho = 5;     // dollars per 1 interest-rate point (1%)
  // Second-order sensitivities, on the same units as their first-order parents.
  double vanna = 6;   // change in delta per 1 IV point
  double volga = 7;   // change in vega per 1 IV point
  double charm = 8;   // change in delta per calendar day
}

// A point on the at-expiry payoff curve.
message PnLPoint {
  double underlying_price = 1;
  double pnl = 2;
}

// A cell of the price × date grid: P&L for a given underlying price at a
// given number of days remaining, with the legs re-priced at that horizon.
message MatrixCell {
  double price = 1;
  uint32 days_to_expiration = 2;
  string date_str = 3;          // YYYY-MM-DD
  double pnl_dollars = 4;
  double return_on_risk_percent = 5;
}

message RiskMetrics {
  double var_parametric_95 = 1;
  double var_parametric_99 = 2;
  double cvar_parametric_95 = 3;
  double cvar_parametric_99 = 4;
}

message StrategyResponse {
  double max_profit = 1;
  double max_loss = 2;
  double break_even = 3;
  double expected_value = 4;
  double pop = 5;                       // Probability of profit
  Greeks net_greeks = 6;
  RiskMetrics risk_metrics = 7;
  repeated PnLPoint pnl_matrix = 8;     // At-expiry curve

  double risk_reward_ratio = 9;
  repeated double breakeven_prices = 10; // All sign changes, not just the first
  repeated MatrixCell matrix = 11;       // Price × date grid
  uint64 calculation_time_microseconds = 12;
  double probability_of_touch = 13;
  double probability_of_target_profit = 14; // P(reaching 50% of max profit)

  // Days from now at which `pnl_matrix` — and every figure derived from it
  // (max_profit, max_loss, breakevens, pop, EV, VaR/CVaR) — is evaluated.
  //
  // This is the EARLIEST leg expiry, not the latest. For a single-expiry
  // structure the two coincide and this is simply the expiry. For a calendar
  // spread they do not: at the far expiry both legs are intrinsic and a
  // same-strike calendar collapses to a flat line at the net debit, which
  // says nothing about the trade. The near expiry is where the structure has
  // its characteristic shape, so that is where the curve is drawn. A client
  // that labels the curve "at expiration" without reading this field will
  // mislabel every multi-expiry position.
  double curve_days_to_expiration = 15;

  // Per-leg risk, in the same units and conventions as net_greeks.
  //
  // The aggregate alone cannot answer "which leg is carrying this?". A four-leg
  // condor nets to a small delta and a small theta while each wing holds a much
  // larger position; closing the wrong side is how a hedged book becomes an
  // unhedged one. Index refers to StrategyRequest.legs, in request order.
  repeated LegRisk leg_risk = 16;
}

// One leg's contribution to the position, already scaled by direction,
// quantity and contract multiplier — these sum to net_greeks exactly.
message LegRisk {
  int32 leg_index = 1;
  Greeks greeks = 2;
  // Black-Scholes value of the leg now, per contract and per share, before
  // multipliers. Zero for a linear leg, which has no model price.
  double model_price = 3;
  // model_price minus the premium paid or received, scaled to the position.
  // What the leg is worth against what it cost.
  double open_pnl = 4;
}

// --------------------------------------------------------------------------
// Market data
// --------------------------------------------------------------------------

message QuoteRequest {
  string symbol = 1;
}

message QuoteResponse {
  string symbol = 1;
  double price = 2;
  double previous_close = 3;
  double forward_pe = 4;
  double implied_volatility = 5;
  string asset_class = 6;
  // Provenance. The UI labels every figure with where it came from, so the
  // provider and the timestamp travel with the value.
  string provider = 7;          // e.g. "alpaca"
  string quote_timestamp = 8;   // RFC3339
}

message OptionStrike {
  double strike = 1;
  double call_bid = 2;
  double call_ask = 3;
  double call_delta = 4;
  int32 call_volume = 5;
  int32 call_open_interest = 6;
  double call_iv = 7;
  double put_bid = 8;
  double put_ask = 9;
  double put_delta = 10;
  int32 put_volume = 11;
  int32 put_open_interest = 12;
  double put_iv = 13;
  bool is_atm = 14;
  string expiration_date = 15;
  double call_gamma = 16;
  double call_theta = 17;
  double call_vega = 18;
  double put_gamma = 19;
  double put_theta = 20;
  double put_vega = 21;
}

message FuturesContract {
  string code = 1;
  string delivery_month = 2;
  int32 days_to_expiry = 3;
  double futures_price = 4;
  double bid = 5;
  double ask = 6;
  double basis = 7;
  double annualized_yield = 8;
  int32 volume = 9;
  int32 open_interest = 10;
  string state = 11;
}

message ExpirationDate {
  string date_str = 1;      // "2026-08-21"
  int32 days_to_expiry = 2;
  string label = 3;         // "Aug 21, 2026 (30d)"
}

message ChainRequest {
  string symbol = 1;
  int32 expiration_days = 2;
  string asset_class = 3;
  string expiration_date = 4; // Explicit date filter, e.g. "2026-08-21"
}

message ChainResponse {
  string symbol = 1;
  double spot_price = 2;
  repeated OptionStrike option_strikes = 3;
  repeated FuturesContract futures_contracts = 4;
  string selected_expiration_date = 5;
  repeated ExpirationDate available_expirations = 6;
  string provider = 7;
}

// --------------------------------------------------------------------------
// Risk-free rate
//
// Previously a hardcoded 0.05 in the browser that still shaped expected value,
// probability of profit and the whole distribution curve. It is now measured,
// and it travels with its observation date and its source so the client can
// say which it is showing instead of implying it was quoted.
// --------------------------------------------------------------------------

message RiskFreeRateRequest {}  // Empty today; room for a tenor filter later.

message RatePoint {
  string tenor = 1;            // "1M", "2M", "3M", "6M", "1Y"
  int32 days = 2;              // nominal tenor in calendar days
  double rate_bey = 3;         // as published: bond-equivalent yield, decimal
  double rate_continuous = 4;  // 2*ln(1 + bey/2), decimal
}

message RiskFreeRateResponse {
  // Continuously compounded, for the default tenor. This is the number to put
  // in StrategyRequest.risk_free_rate: Black-Scholes discounts continuously,
  // and par yields are quoted on a semiannual convention, so the two are not
  // interchangeable (3.6 bp apart at 3.83%).
  double rate = 1;
  // The same tenor exactly as published, so a user can verify it at source.
  double rate_published = 2;
  string tenor = 3;            // which tenor `rate` and `rate_published` are
  string as_of_date = 4;       // observation date, YYYY-MM-DD — not fetch time
  string source = 5;           // provider dataset id, e.g. "us_treasury_par_yield"
  repeated RatePoint curve = 6; // short end, ascending — allows expiry interpolation later
  string fetched_at = 7;       // RFC3339, when the backend obtained it
}
