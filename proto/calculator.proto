syntax = "proto3";

package calculator;

service OptionsCalculator {
  rpc CalculateStrategy (StrategyRequest) returns (StrategyResponse);
  rpc GetMarketQuote (QuoteRequest) returns (QuoteResponse);
  rpc GetMarketChain (ChainRequest) returns (ChainResponse);
}

message Leg {
  enum Action { BUY = 0; SELL = 1; }
  enum Type { CALL = 0; PUT = 1; FUTURE = 2; STOCK = 3; }
  
  Action action = 1;
  Type type = 2;
  double strike = 3;
  double expiration_days = 4;
  int32 quantity = 5;
}

message StrategyRequest {
  string underlying_symbol = 1;
  double current_price = 2;
  double implied_volatility = 3;
  double risk_free_rate = 4;
  repeated Leg legs = 5;
}

message Greeks {
  double delta = 1;
  double gamma = 2;
  double theta = 3;
  double vega = 4;
  double rho = 5;
}

message PnLPoint {
  double underlying_price = 1;
  double pnl = 2;
}

message RiskMetrics {
  double var_parametric_95 = 1;
  double var_parametric_99 = 2;
  double cvar_parametric_95 = 3;
  double cvar_parametric_99 = 4;
}

message StrategyResponse {
  double max_profit = 1;
  double max_loss = 2;
  double break_even = 3;
  double expected_value = 4;
  double pop = 5; // Probability of Profit
  Greeks net_greeks = 6;
  RiskMetrics risk_metrics = 7;
  repeated PnLPoint pnl_matrix = 8;
}

// Live Yahoo Finance Market Quote Messages
message QuoteRequest {
  string symbol = 1;
}

message QuoteResponse {
  string symbol = 1;
  double price = 2;
  double previous_close = 3;
  double forward_pe = 4;
  double implied_volatility = 5;
  string asset_class = 6;
}

// Live Market Option & Futures Chains Messages
message OptionStrike {
  double strike = 1;
  double call_bid = 2;
  double call_ask = 3;
  double call_delta = 4;
  int32 call_volume = 5;
  int32 call_open_interest = 6;
  double call_iv = 7;
  double put_bid = 8;
  double put_ask = 9;
  double put_delta = 10;
  int32 put_volume = 11;
  int32 put_open_interest = 12;
  double put_iv = 13;
  bool is_atm = 14;
}

message FuturesContract {
  string code = 1;
  string delivery_month = 2;
  int32 days_to_expiry = 3;
  double futures_price = 4;
  double bid = 5;
  double ask = 6;
  double basis = 7;
  double annualized_yield = 8;
  int32 volume = 9;
  int32 open_interest = 10;
  string state = 11;
}

message ChainRequest {
  string symbol = 1;
  int32 expiration_days = 2;
  string asset_class = 3;
}

message ChainResponse {
  string symbol = 1;
  double spot_price = 2;
  repeated OptionStrike option_strikes = 3;
  repeated FuturesContract futures_contracts = 4;
}
